<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>HREC – AI HR & Recruitment System</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="theme-dark">
    <div class="auth-shell">
      <div class="auth-layout">
        <!-- LEFT SIDE -->
        <div class="auth-card">
          <div class="auth-top">
            <div>
              <div class="brand">HREC</div>
              <div class="muted">AI HR & Recruitment System</div>
            </div>
            <button class="btn btn-ghost" id="themeToggle" title="Toggle theme" type="button">☾</button>
          </div>
  
          <div class="tabs">
            <button class="tab active" data-tab="login" type="button">Login</button>
            <button class="tab" data-tab="register" type="button">Register</button>
          </div>
  
          <div id="alert" class="alert hidden"></div>
  
          <form id="loginForm" class="form">
            <label>
              <span>Email</span>
              <input type="email" name="email" placeholder="you@company.com" required />
            </label>
  
            <label>
              <span>Password</span>
              <input type="password" name="password" placeholder="••••••••" required />
            </label>
  
            <button class="btn btn-primary" type="submit">Login</button>
  
            <label>
              <span>Choose role for Google login</span>
              <select id="googleRole" class="input">
                <option value="Candidate">Candidate</option>
                <option value="HR">HR</option>
                <option value="Employee">Employee</option>
              </select>
            </label>
  
            <button id="googleBtn" class="google-btn" type="button">
              <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google" />
              Continue with Google
            </button>
          </form>
  
          <form id="registerForm" class="form hidden">
            <label>
              <span>Name</span>
              <input type="text" name="name" placeholder="Full name" />
            </label>
  
            <label>
              <span>Email</span>
              <input type="email" name="email" placeholder="you@company.com" required />
            </label>
  
            <label>
              <span>Password</span>
              <input type="password" name="password" placeholder="Create a password" required />
            </label>
  
            <label>
              <span>Role</span>
              <select name="role" required>
                <option value="Candidate">Candidate</option>
                <option value="Employee">Employee</option>
                <option value="HR">HR</option>
              </select>
            </label>
  
            <button class="btn btn-primary" type="submit">Create account</button>
          </form>
        </div>
  
        <!-- RIGHT SIDE -->
        <div class="auth-hero">
          <div class="hero-card">
            <div class="hero-chip">Smart Hiring • Better Decisions</div>
            <h1 class="hero-title">Welcome to HREC.</h1>
            <p class="hero-subtitle">
              Elevate hiring with an intelligent recruitment experience built for HR teams,
              candidates, and employees.
            </p>
  
            <div class="hero-points">
              <div class="hero-point"><div class="hero-dot"></div><span>AI-powered resume analysis</span></div>
              <div class="hero-point"><div class="hero-dot"></div><span>Role-based dashboards</span></div>
              <div class="hero-point"><div class="hero-dot"></div><span>Interview scoring & insights</span></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  
    <script src="script.js?v=loginlayoutfinal1"></script>
  </body>
</html>
